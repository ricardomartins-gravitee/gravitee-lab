name: Fork upstream sync

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: Check the release and merge without opening a pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Propose the newest upstream release
    if: ${{ github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the fork's reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare an upstream release PR
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          FORK_SYNC_PREVIEW: ${{ inputs.preview }}
        run: python3 -I .github/scripts/fork_upstream_sync.py
